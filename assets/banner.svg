<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.05); }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconPing {
        0% { r: 4px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }
      .floating-card { animation: floatSlow 6s ease-in-out infinite; }
      .ambient-glow { animation: pulseGlow 4s ease-in-out infinite; }
      .data-pipe {
        stroke-dasharray: 12 8;
        animation: flowData 4s linear infinite;
      }
      .beacon { animation: beaconPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid-pattern)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="70" r="120" fill="#0284c7" opacity="0.15" filter="url(#glow-heavy)" class="ambient-glow" />
  <circle cx="1080" cy="280" r="140" fill="#7c3aed" opacity="0.18" filter="url(#glow-heavy)" class="ambient-glow" style="animation-delay: -2s;" />

  <!-- Dynamic Data Pipeline Visual Elements (Left & Right) -->
  <g opacity="0.85">
    <!-- Stream Line 1 -->
    <path d="M 40 180 Q 200 130 360 210 T 600 180" fill="none" stroke="url(#cyan-grad)" stroke-width="2.5" class="data-pipe" />
    <!-- Stream Line 2 -->
    <path d="M 640 180 Q 800 230 960 150 T 1160 180" fill="none" stroke="url(#glow-grad)" stroke-width="2.5" class="data-pipe" style="animation-duration: 3s;" />

    <!-- Node Beacons -->
    <circle cx="80" cy="170" r="5" fill="#38bdf8" />
    <circle cx="80" cy="170" r="4" fill="none" stroke="#38bdf8" stroke-width="2" class="beacon" />

    <circle cx="1120" cy="180" r="5" fill="#ec4899" />
    <circle cx="1120" cy="180" r="4" fill="none" stroke="#ec4899" stroke-width="2" class="beacon" style="animation-delay: -1s;" />
  </g>

  <!-- Dynamic Badges / Stream Pill Highlights in Background -->
  <g class="floating-card" transform="translate(60, 42)" opacity="0.9">
    <rect width="210" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" fill-opacity="0.8" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <text x="35" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ REAL-TIME INGESTION</text>
  </g>

  <g class="floating-card" transform="translate(930, 42)" opacity="0.9" style="animation-delay: -3s;">
    <rect width="210" height="38" rx="19" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" fill-opacity="0.8" />
    <circle cx="20" cy="19" r="6" fill="#a855f7" />
    <text x="35" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🎯 IDENTITY RESOLUTION</text>
  </g>

  <g class="floating-card" transform="translate(890, 280)" opacity="0.9" style="animation-delay: -1.5s;">
    <rect width="250" height="38" rx="19" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" fill-opacity="0.8" />
    <circle cx="20" cy="19" r="6" fill="#06b6d4" />
    <text x="35" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🔄 REVERSE ETL &amp; SYNCS</text>
  </g>

  <g class="floating-card" transform="translate(60, 280)" opacity="0.9" style="animation-delay: -4.5s;">
    <rect width="230" height="38" rx="19" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" fill-opacity="0.8" />
    <circle cx="20" cy="19" r="6" fill="#ec4899" />
    <text x="35" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🛡️ PRIVACY &amp; COMPLIANCE</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) -->
  <g text-anchor="middle">
    <!-- Super Title / Category Tag -->
    <rect x="470" y="58" width="260" height="28" rx="14" fill="#334155" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <text x="600" y="77" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE &amp; OPEN SOURCE</text>

    <!-- Main Title with Glowing Gradient -->
    <text x="600" y="145" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow-soft)">Real-Time Customer Data Platform</text>
    <text x="600" y="145" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Real-Time Customer Data Platform</text>

    <!-- Subtitle -->
    <text x="600" y="185" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      Curated Real-Time CDPs, Reverse ETL, Event Streaming &amp; Unified Customer 360 Profiles
    </text>

    <!-- Secondary Meta Description -->
    <text x="600" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Commercial Cloud Leaders • Open-Source Alternatives • Real-Time Identity Resolution • Privacy First
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(600, 252)">
      <rect x="-240" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="-185" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📊 CDP 360°</text>

      <rect x="-115" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="-60" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ STREAMING</text>

      <rect x="10" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="65" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔄 REVERSE ETL</text>

      <rect x="135" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="190" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔓 OPEN SOURCE</text>
    </g>
  </g>
</svg>
